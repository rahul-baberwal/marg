<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marg - Open Shared Route</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #0f172a; color: #f8fafc; text-align: center; padding: 20px; box-sizing: border-box; }
        .card { background: #1e293b; padding: 36px 24px; border-radius: 24px; max-width: 420px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .logo { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 16px; }
        h1 { font-size: 22px; margin: 0 0 8px; color: #fff; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
        .btn { display: block; width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; font-weight: 600; text-decoration: none; font-size: 15px; box-sizing: border-box; }
        .btn-primary { background: #16a34a; color: white; }
        .btn-secondary { background: #334155; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <img src="assets/icon.png" alt="Marg" class="logo" onerror="this.style.display='none'">
        <h1>Opening Route in Marg...</h1>
        <p>If Marg does not open automatically, tap the button below or download Marg to view and simulate this route.</p>
        <a id="openBtn" href="#" class="btn btn-primary">Open in Marg App</a>
        <a href="https://play.google.com/store/apps/details?id=com.rahulbaberwal.marg" class="btn btn-secondary">Get it on Google Play</a>
        <a href="https://indusapp.store/3y8hrlz0" class="btn btn-secondary">Get on Indus Appstore</a>
    </div>

    <script>
        const search = window.location.search;
        const appSchemeUrl = "marg://route" + search;
        document.getElementById("openBtn").href = appSchemeUrl;

        // Attempt to launch app via custom scheme
        window.location.href = appSchemeUrl;

        // If not installed, redirect to Play Store after timeout
        setTimeout(function() {
            if (!document.hidden) {
                window.location.href = "https://play.google.com/store/apps/details?id=com.rahulbaberwal.marg";
            }
        }, 2200);
    </script>
</body>
</html>
